project_id = "siniloan-enterprise-data"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "core", "jobseekers", "research", "biometrics"]
extra_search_path = ["public", "extensions", "core"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MiB"
